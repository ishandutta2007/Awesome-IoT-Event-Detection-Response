<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f1035"/>
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.15); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
      }
      .bg-glow-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
      .bg-glow-2 { animation: pulseGlow 8s ease-in-out infinite 3s; transform-origin: 1000px 220px; }
      .flow-line { stroke-dasharray: 12, 12; animation: flowDash 15s linear infinite; }
      .particle { animation: floatParticle 5s ease-in-out infinite; }
      .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#374151" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Background Dynamic Network/Circuit Visuals (Subtle, strictly behind text) -->
  <g opacity="0.25">
    <circle cx="200" cy="100" r="180" fill="url(#glowCyan)" class="bg-glow-1"/>
    <circle cx="1000" cy="220" r="220" fill="url(#glowPurple)" class="bg-glow-2"/>

    <!-- Telemetry Data Flow Lines -->
    <path d="M 50 260 Q 300 180 600 240 T 1150 120" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line"/>
    <path d="M 100 60 Q 400 160 800 80 T 1100 260" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-line"/>

    <!-- Nodes & Pulse Signals -->
    <circle cx="250" cy="200" r="6" fill="#38bdf8" class="particle"/>
    <circle cx="550" cy="130" r="5" fill="#a855f7" class="particle" style="animation-delay: 1.5s;"/>
    <circle cx="850" cy="210" r="7" fill="#818cf8" class="particle" style="animation-delay: 2.5s;"/>
    <circle cx="1050" cy="100" r="4" fill="#38bdf8" class="particle" style="animation-delay: 0.8s;"/>
  </g>

  <!-- Foreground Content Container (Guaranteed Clear & Readable) -->
  <g filter="url(#shadow)">
    <!-- Category Badge -->
    <rect x="70" y="45" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="185" y="66" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" class="sub-text" letter-spacing="1">⚡ AWESOME IOT ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="70" y="140" fill="url(#textGrad)" font-size="44" class="title-text" letter-spacing="-0.5">Awesome IoT Event Detection &amp; Response</text>

    <!-- Subtitle -->
    <text x="70" y="185" fill="#e2e8f0" font-size="19" class="sub-text">Curated SaaS Platforms, Complex Event Processing (CEP) &amp; Open-Source Rules Engines</text>

    <!-- Feature Tags Row -->
    <g transform="translate(70, 225)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="32" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
      <text x="82.5" y="20" fill="#9ca3af" font-size="13" text-anchor="middle" class="sub-text">📡 Real-Time Telemetry</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="180" height="32" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
      <text x="265" y="20" fill="#9ca3af" font-size="13" text-anchor="middle" class="sub-text">🧠 Complex Event Logic</text>

      <!-- Tag 3 -->
      <rect x="365" y="0" width="170" height="32" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
      <text x="450" y="20" fill="#9ca3af" font-size="13" text-anchor="middle" class="sub-text">⚡ Automated Triggering</text>

      <!-- Tag 4 -->
      <rect x="545" y="0" width="160" height="32" rx="8" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
      <text x="625" y="20" fill="#9ca3af" font-size="13" text-anchor="middle" class="sub-text">🛡️ Edge &amp; Security CEP</text>
    </g>
  </g>
</svg>
